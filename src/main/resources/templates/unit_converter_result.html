<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Unit Converter</title>
    <meta name="viewport" content="width=device-width">
</head>
<body>
<h1>Result</h1>

<p th:if="${category == 'length'}"
        th:text="'Length: ' + ${#numbers.formatDecimal(unit_converter.lengthInput, 1, 2)}"/>
<p th:if="${category == 'weight'}"
        th:text="'Weight: ' + ${#numbers.formatDecimal(unit_converter.weightInput, 1, 2)}"/>
<p th:if="${category == 'temperature'}"
        th:text="'Temperature: ' + ${#numbers.formatDecimal(unit_converter.temperatureInput, 1, 2)}"/>

<p th:text="'Unit from: ' + ${unit_converter.unitFrom}"/>
<p th:text="'Unit to: ' + ${unit_converter.unitTo}"/>
<p th:text="'Converted Result: ' + ${#numbers.formatDecimal(result, 1, 2)}"/>

<a href="/unit_converter"> [CONVERT ANOTHER UNIT]</a>

</body>
</html>
